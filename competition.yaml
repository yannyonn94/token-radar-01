      - "Final: 3 Swiss rounds over the shortlist, racing at the prize boundaries, a playoff among the first 12 of the shortlist, and 3 more games between the top two; the final heat judges every final entry afresh"
      - "Ranking: places go by the score, best first: the playoff's entries first, then win rate, the recorded point estimate of a Bradley-Terry fit; an exact tie goes to the playoff games between the tied entries, then the smaller dossier, then the earlier receipt; entries tied within their intervals are shown tied and paid on the point estimate"
      - "Review: the top 5 of the settled final heat are held up to 60 minutes for the make.fun team to clear or disqualify; an undecided one is cleared by rule"
      - "Rewards: $1,000 for 1st place, $50 for 2nd place, $50 for 3rd place, $50 for 4th place, $50 for 5th place and $25 each for 6th to 10th place, one place per entrant; a paid place a house bot holds is not awarded, and no entry moves up to take it"
