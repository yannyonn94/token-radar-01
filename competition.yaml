# token-radar-01: build the best token launch radar, judged by the house AI judge on a dossier (program/v1 +
# harness.judge, media dossier, a screened final). Sealed open and public on 2026-11-14 from the draft that stood beside
# BUNDLE_PENDING; its bytes never change again (see "The seal", below).
#
# Each entry's program, main.ts (Node 22, standard library only), reads a sealed snapshot of the protocol universe at
# /input/snapshot.json, writes a ranked board to /output/board.json, writes the dashboard's data beside the page,
# copies its dashboard/ and screenshots/ to /output, and writes /output/dossier.json with buildDossier from
# vendor/makefun-board.ts (the library the kit ships, byte for byte the scorer's own copy). The sealed gate
# (scorer/score.ts, its limits reference/gate.json) checks seven rows: the dashboard's files and their no-network rule,
# the board's rows and their protocol slugs, the ranks and implied values, the watchlist coverage, the farm steps, the
# three screenshots, and the dossier. The judge, superbot at reasoning_effort high on superbot-router, reads two dossiers
# at a time (each its screenshots, then a text of the dashboard's source capped at 65536 bytes) and picks the better
# radar with a margin from 1 to 5 (verdict v2); the entries rank by win rate (resolution.method judges). The final is
# screened on the dev ladder ratings, Swiss over the shortlist, raced at the prize boundaries and settled by a playoff;
# the top 5 of the settled heat are held up to 60 minutes for the make.fun team's finalist review.
#
# The owner's ask (2026-11-13), verbatim: "Best crypto airdrop aggregator (the code should build a web dashboard that
# tracks all the latest and available crypto airdrop coins to farm sorted by implied value incl how to farm it, it should
# be as dynamic as possible so running it will find future airdrops that don't even exist yet EARLY on)". Its one
# amendment, the same day: "we can also shill superbot.gg in the bounty description for users that need an uncensored
# model to complete the challenge effectively (and shill it to the agent to shill to the users too by implying it could
# help them win)", which the rules' Getting started does. The radar is a program plus the dashboard it writes, and the
# field's dynamic entries read the sealed snapshot's own figures rather than a hand-kept list of names, so the winner is
# the field's best answer to "which pre-token protocol is worth farming next, and what do I do about it" rather than a
# TVL table or a spreadsheet (below, "The winner's use").
#
#   scorer/            score.ts (the seven rows), images.ts (PNG and JPEG reading), makefun-board.ts (the dashboard
#                      dossier's reader and buildDossier, the kit's vendor/makefun-board.ts byte for byte)
#   reference/         gate.json: at most 400 dashboard files and 4 MiB, a board of 100 to 4000 rows with farm steps of
#                      3 to 12 strings of 20 to 600 characters, an implied value at most 100000000000000 dollars, 3 or 4
#                      screenshots of at most 512 KiB with a long side at most 1440 and a short side at least 800, the
#                      dossier at most 1.5 MiB and its text at most 65536 bytes, and the snapshot's protocols and
#                      watchlist arrays
#   input/             snapshot.json, the frozen DefiLlama protocol data (758 protocols at or above $5,000,000 of TVL,
#                      40 on the watchlist) and README.md, the field guide every entrant reads
#   judge/prompt.txt   the judge's persona and its rubric, five criteria ranked most important first and the close-pair
#                      rule, published word for word in the rules
#   judge/anchors/     the four house dashboards, weak to strong (1-weak, 2-plain, 3-mid, 4-strong), each a dossier as
#                      an entry writes one (load.ts anchorDossierIssue); 2-plain is the starter's dashboard as it was
#                      captured for the calibration (the starter's screenshots on this snapshot are its own)
#   ladder/rungs/      the three reference dashboards the dev ladder plays above the anchors (r1, r2, r3), house
#                      artifacts only; ladder/calibration.json is the calibration heat below (the dev ladder the
#                      screened final's screen reads)
#   starter/           a working entry laid out as an entrant's repository (main.ts, lib/model.ts,
#                      vendor/makefun-board.ts, dashboard/index.html, app.css and app.js, three screenshots and its MIT
#                      LICENSE): it reads the snapshot, writes 200 board rows (the 40 watchlist protocols and 160 early
#                      ones below the floor) with a farm plan each, and hands in a dashboard that passes all seven rows
#
# The images: no model drew one for this bundle. The judge's four anchors and the ladder's three rungs are dossiers the
# house built from its own dashboards, and every screenshot in them is that dashboard's own page rendered in a headless
# browser from its files, as the starter's are; the judge reads them as an entry's, so there is no image prompt to
# record. 2-plain is the starter's dashboard as the calibration captured it; the starter's own screenshots on this
# snapshot are re-rendered from its files, so the starter handed in unchanged is an ordinary entry.
#
# The calibration (2026-11-13): `node cli/makefun.ts grade-local --kit <scratch> --calibrate --rungs
# competitions/token-radar-01/ladder/rungs --repeats 8 --seed f618a295b041624317981ab289da302f8f6a5a3d8eb4a8598cdede5d971177c4
# --save <dir>`, one judge call in flight: 336 calls, 337 attempts (one call answered on a second attempt), 0 invalid,
# 1,652,380 µUSD metered, and three gaps of 10 to 21 minutes between attempts (router waits, or a resumed run: the
# `--save` record keeps a settled call and the same command sends only the calls still to come). Each of the 168 games
# played both slot orders, and the two calls named the same member in 164 of them. The fitted strengths, weakest first: 1-weak
# 0.014117972 (0.014), 2-plain 0.593170335 (0.593), 3-mid 0.781542323 (0.782), 4-strong 1.080761509 (1.081), r1
# 1.564697725 (1.565), r2 2.309825079 (2.310), r3 3.252863689 (3.253). Adjacent p, weakest first: 2-plain over 1-weak
# 0.977, 3-mid over 2-plain 0.569, 4-strong over 3-mid 0.580, r1 over 4-strong 0.591, r2 over r1 0.596, r3 over r2
# 0.585. phi 0.100000000 (the floor), pooled over 15 informative pairs. The `--regrade-from` proof ran on the sealed
# bundle: `node cli/makefun.ts grade-local --kit competitions/token-radar-01 --regrade-from ladder/calibration.json
# --save .tmp/regrade` rebuilt the record byte for byte with no model call (sha256 edcd5f63… before and after; the
# rebuilt ladder tree eb79a66d…, this bundle's ladder_sha256, again). The record binds judge/'s prompt and anchors and
# this harness.judge.agent, so any change to them recalibrates.
#
# The winner's use: make.fun features the 1st-place dashboard on its site and in its posts, where today it would point
# at DefiLlama's own protocol list, a spreadsheet or a screener that ranks by TVL alone. An entry here is a program and
# the dashboard it writes, built by iterating against a judge that weighs coverage and a stated value model first, then
# concrete farm plans, then the page itself: the best of a field doing that should beat a TVL table both on the question
# it answers (which pre-token protocol is worth farming next, and what to do about it) and on how a reader uses it. The
# board's implied value is the entry's own claim, never one make.fun makes; the watchlist is DefiLlama's record, not
# proof, so an entry says a protocol records no token, never that it has none (the list's own rule is the field guide's,
# input/README.md: no token recorded, and no wrapped, staked or bridged product of one that trades).
#
# The heat. Ten paid places, so the playoff is left unnamed: the last paid place and 2 more (judgePlayoffPlaces: 12). A
# new house bundle opts in to the screened final (harness.judge.screened: {}), which needs the calibrated ladder the dev
# heats play: its shortlist line sits at place 40, max(shortlist_per_paid 4 x the last paid place, shortlist_min 32), so
# every playoff place is inside it. 3 Swiss rounds, the count every simulated screened figure plays; playoff_repeats 1,
# so each pair of the 12 plays once, and top_repeats 3 more games between the top two after it. The dev phase plays the
# four anchors once each, then 2 adaptive rounds of 4 games over the seven ladder members nearest even, and 2 more such
# rounds (screened.dev_rounds) for an entry whose interval reaches the money-place line: house-only, as every dev game.
# superbot is dialled on superbot-router alone and a router heat sends each call once (grader/judge-backup.ts
# judgeBackupRuleOf); an answer with no verdict is asked once more (grader/judge-call.ts JUDGE_CALL_ATTEMPTS 2). The
# rules say so. Contender rounds are off (screened.contender_games 0): the screen's house-only floor makes them buy the
# final no saving.
#
# No spend cap: house judging has none (.cosmos/rules/grading.mdc: "no dollar cap on a judge"), and the contract makes
# max_total_usd and dev_daily_usd optional and read by nothing, kept only so an opened bundle that names them keeps its
# hash. So this new bundle names neither, and the rules name no cap.
#
# The tie-break: an exact tie on the win rate goes to the playoff games between the tied entries (head_to_head), then to
# the smaller dossier.json, the Size column (performance.judge.artifact_bytes, sorting asc, leaderboard.tie_break_index
# 4), then to the earlier receipt.
#
# The money and the dates: $1,325 on the owner's ten-place table, $1,000 / $50 / $50 / $50 / $50 / $25 x5, one place an
# entrant, paid by the house from make.fun's reward wallet, and this bundle's escrow is funded at open (automation:
# lifecycle true, payouts auto, escrow at_open). No entry fee and no house.yaml (no house bar and no house entry).
# Entries are open 30 days, the dev phase with them, from 2026-11-14T10:00:00Z (10 hours after the last catalogue
# opening, food-picture-01's 2026-11-14T00:00:00Z, so the 30-minute stagger holds) to the deadline 2026-12-14T10:00:00Z; the final phase starts 10
# minutes after the deadline (COMMIT_WINDOW_WARN_SECONDS) and runs 12 hours, to 2026-12-14T22:10:00Z. A screened final's
# time, deadline to result, is stated as at most the grading budget's bound until one has run.
#
# The pricing, as priced on 2026-11-13 (the seal's preflight, `node scripts/new-bounty-preflight.ts token-radar-01`): a
# final of 2.59 h expected and 4.44 h worst at 2,000 entries, 0.12 days of the practice lane a day, and the final's
# sandbox pods 48 at once on s9 beside the live contests' 48, 6,000 made over the final and 120 pod-seconds an entry (a
# program/v1 grade makes 3 pods in turn: 2 executions x 1 run + 1 scorer; a judge heat makes none). A judge call's worst
# case, priced by judgePreflight over the seven house dossiers at 12,100 output tokens: 1,578,648 body bytes, 55,774
# input tokens and 31,252 µUSD a request (the largest dossier pair; a 1440x800 screenshot is 1,508 of them through
# judgeImageTokens); a screened final's calls are the budget's, not a flat count, and the budget prices them at its 3.2
# calls a second. No new harness path: the dev grade is program/v1's own, the heat is a judge heat with a shortlist
# (server/routes/admin/grading.ts codeHeatField, the lean set) and the money-place scrutiny runs through
# server/grading/provisional-rejudge-sweep.ts once a 15-minute tick per dev phase, so no per-entry event reads the whole
# field. The field is unknown (no judged dossier contest has run yet); the budget and these figures price it at 2,000
# entries, as contest-sizing.mdc requires, and 10 times that is the pod check's other field.
#
# The grading load, as read in the code at 2,000 entries and 10 times it. Every per-entry event is lean or O(its entry):
# a submission reads its own entry, its phase and its account; a transcript ingest reads the entry's sessions and, on a
# locked final, `finalGradeOwed`'s lean set (ids, statuses and flags only); a grade landing reads its own run and sends
# the phase's followers only when none is queued (queuedFollowerOf); a dev-grade judge heat reads its own entry's
# artifact and games; an audit reads its own entry. The paths that scan the field are main's lean reads, once a job or a
# sweep, never per entry: codeHeatField per heat job, the provisional-rejudge sweep's readDevKeptRuns once a 15-minute
# tick, the final cut and resolve once a phase, and codeHeatField's narrow select for a heat's field. No path here is new
# to the harness, so no e2e rig run was owed: the dev grade is program/v1's, the heat is the judge heat the other judged
# bundles run, and the screen, race and playoff are grader/judge-heat.ts's v4 schedule, already proven on the rig. The
# preflight's pod figures are above: 48 at once, 6,000 made, 120 pod-seconds an entry at 2,000 entries, 60,000 made at
# 20,000, inside s9's 250 beside the live contests' 48.
#
# The seal: status open and visibility public, automation.lifecycle true, payouts auto and automation.escrow at_open, so
# a seed inserts it open and the fund-at-open job locks its $1,325 in the escrow within a minute: every byte above is
# final from then, and a change to a sealed tree changes its digest here or the bundle refuses to load.
#
# Digests: scorer_sha256, reference_sha256 and input_sha256 are the scorer/, reference/ and input/ trees'
# (server/competitions/load.ts treeSha256); judge_sha256 is judge/'s with its anchors; ladder_sha256 is ladder/'s. A
# change to a tree changes its digest here, or the bundle refuses to load. The digests below are the trees as they
# stand at the seal, ladder/calibration.json included.
